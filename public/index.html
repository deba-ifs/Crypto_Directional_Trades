<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETH 15M Quant Engine | Delta Exchange India</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0e14;
      --panel-bg: #131722;
      --card-bg: #1e222d;
      --card-border: #2a2e39;
      --text-main: #d1d4dc;
      --text-bright: #f0f3fa;
      --accent-green: #089981;
      --accent-red: #f23645;
      --accent-blue: #2962ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.4rem; color: var(--text-bright); font-weight: 800; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; }
    .card-title { font-size: 0.75rem; color: #787b86; text-transform: uppercase; font-weight: 600; }
    .card-value { font-size: 1.5rem; color: var(--text-bright); font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
    .badge-bull { background: rgba(8, 153, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-bear { background: rgba(242, 54, 69, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .badge-neutral { background: rgba(41, 98, 255, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
    .chart-panel { background: var(--panel-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ ETH 15M Volatility Breakout Analytics</h1>
    <span style="font-size: 0.8rem; color: var(--accent-green); font-weight: 600;">● VERCEL SERVERLESS LIVE</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">ETH Spot Price</div>
      <div class="card-value" id="spotPrice">$0.00</div>
    </div>
    <div class="card">
      <div class="card-title">Signal State</div>
      <div class="card-value" style="font-size: 1rem; margin-top: 6px;">
        <span class="badge badge-neutral" id="signalState">LOADING...</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">15M Squeeze</div>
      <div class="card-value" id="squeezeStatus">--</div>
    </div>
    <div class="card">
      <div class="card-title">Delta Options PCR</div>
      <div class="card-value" id="pcrVal">0.00</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">Exact Entry</div>
      <div class="card-value" style="color: var(--accent-blue);" id="entryVal">$0.00</div>
    </div>
    <div class="card">
      <div class="card-title">Strict Take-Profit</div>
      <div class="card-value" style="color: var(--accent-green);" id="tpVal">$0.00</div>
    </div>
    <div class="card">
      <div class="card-title">Strict Stop-Loss</div>
      <div class="card-value" style="color: var(--accent-red);" id="slVal">$0.00</div>
    </div>
  </div>

  <div class="chart-panel">
    <div id="chart" style="width: 100%; height: 550px;"></div>
  </div>

  <script>
    async function fetchQuantData() {
      try {
        const res = await fetch('/api');
        const data = await res.json();
        
        document.getElementById('spotPrice').innerText = `$${data.spot_price.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        
        const stateEl = document.getElementById('signalState');
        stateEl.innerText = data.signal_state;
        stateEl.className = `badge ${data.signal_state.includes('BULLISH') ? 'badge-bull' : data.signal_state.includes('BEARISH') ? 'badge-bear' : 'badge-neutral'}`;
        
        document.getElementById('squeezeStatus').innerText = data.squeeze_on ? 'ON (Compressed)' : 'OFF (Expanded)';
        document.getElementById('squeezeStatus').style.color = data.squeeze_on ? '#f5a623' : '#089981';
        document.getElementById('pcrVal').innerText = data.pcr;

        document.getElementById('entryVal').innerText = `$${data.targets.entry.toFixed(2)}`;
        document.getElementById('tpVal').innerText = `$${data.targets.target.toFixed(2)}`;
        document.getElementById('slVal').innerText = `$${data.targets.sl.toFixed(2)}`;

        // Render Plotly Chart
        const s = data.series;
        const traceCandles = { x: s.timestamps, open: s.open, high: s.high, low: s.low, close: s.close, type: 'candlestick', name: 'ETH 15M' };
        const traceEMA20 = { x: s.timestamps, y: s.ema_20, mode: 'lines', name: 'EMA 20', line: { color: '#2962ff' } };
        const traceEMA200 = { x: s.timestamps, y: s.ema_200, mode: 'lines', name: 'EMA 200', line: { color: '#9c27b0' } };
        const traceMom = { x: s.timestamps, y: s.momentum, type: 'bar', name: 'Momentum', xaxis: 'x', yaxis: 'y2', marker: { color: s.momentum.map(v => v > 0 ? '#089981' : '#f23645') } };

        const layout = {
          grid: { rows: 2, columns: 1, pattern: 'independent' },
          paper_bgcolor: '#131722', plot_bgcolor: '#131722',
          margin: { l: 40, r: 20, t: 20, b: 20 },
          showlegend: false,
          xaxis: { gridcolor: '#2a2e39', rangeslider: { visible: false } },
          yaxis: { domain: [0.3, 1.0], gridcolor: '#2a2e39' },
          yaxis2: { domain: [0.0, 0.22], gridcolor: '#2a2e39' }
        };

        Plotly.newPlot('chart', [traceCandles, traceEMA20, traceEMA200, traceMom], layout, { responsive: true });
      } catch (e) {
        console.error('Fetch error:', e);
      }
    }

    fetchQuantData();
    setInterval(fetchQuantData, 30000); // Auto refresh every 30 seconds
  </script>
</body>
</html>
